<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="B.LEAGUE審判員の担当試合数・担当カードを検索できます。"><title>B.LEAGUE 審判員 担当試合数・担当カード検索</title>
<style>
:root{--navy:#111c2b;--blue:#1769d2;--ink:#14253b;--muted:#607086;--line:#dbe4ef;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif}.hero{background:linear-gradient(120deg,#111c2b,#203c5d);color:#fff;padding:28px max(20px,calc((100% - 1180px)/2)) 30px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#a9c9f4;font-weight:800}.hero h1{font-size:clamp(23px,4vw,36px);margin:8px 0}.hero p{margin:0;color:#d7e2f1}.wrap{max-width:1180px;margin:24px auto;padding:0 18px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #132b4710}.label{display:block;font-weight:800;margin-bottom:10px}select,input{font:inherit;width:100%;padding:13px 14px;border:1px solid #bdcde0;border-radius:10px;background:#fff;color:var(--ink)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-top:16px}.summary{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;align-items:stretch}.refname{display:flex;align-items:center;gap:16px}.number{background:#233348;color:#fff;border-radius:14px;min-width:90px;text-align:center;padding:20px 12px;font-size:27px;font-weight:900}.refname h2{margin:0 0 5px;font-size:clamp(22px,3vw,30px)}.refname p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f0f6fd;border-radius:12px;padding:15px 12px}.stat small{display:block;color:var(--muted);font-weight:700;font-size:12px}.stat strong{display:block;font-size:27px;margin-top:5px}.stat.total{background:#e2efff}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 2px 12px}.section-title h2{font-size:21px;margin:0}.muted{color:var(--muted);font-size:13px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #e8eef5;font-size:14px}th{background:#edf3fa;color:#34475e;font-size:12px;white-space:nowrap}tbody tr:last-child td{border-bottom:0}.pill{display:inline-block;background:#e7edf5;border-radius:20px;padding:4px 10px;font-weight:750;font-size:12px}.empty{text-align:center;color:var(--muted);padding:35px}.foot{color:var(--muted);font-size:12px;line-height:1.7;padding:10px 2px 28px}.count{font-weight:800;color:var(--blue)}@media(max-width:760px){.hero{padding:24px 18px}.wrap{margin:16px auto;padding:0 12px}.panel{padding:16px}.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.number{min-width:75px;font-size:23px}.stat strong{font-size:24px}.section-title{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header class="hero"><div class="eyebrow">B.LEAGUE OFFICIALS · DATA SEARCH</div><h1>審判員 担当試合数・担当カード検索</h1><p>審判員を選択して、担当試合数と担当カードを確認できます。</p></header>
<main class="wrap">
<section class="panel"><label class="label" for="referee">審判員を選択（背番号＋名前）</label><select id="referee"><option value="">データを読み込み中…</option></select>
<div class="filters"><div><label class="label" for="keyword">カード・会場で検索</label><input id="keyword" placeholder="例：琉球、沖縄アリーナ"></div><div><label class="label" for="league">リーグ</label><select id="league"><option value="">すべて</option><option>B.PREMIER</option><option>B.ONE</option><option>B.NEXT</option></select></div><div><label class="label" for="role">担当区分</label><select id="role"><option value="">すべて</option><option value="CC">CC</option><option value="U1">U1</option><option value="U2">U2</option></select></div></div></section>
<section class="panel summary" id="summary" hidden><div class="refname"><div class="number" id="number"></div><div><h2 id="name"></h2><p id="affiliation"></p></div></div><div class="stats" id="stats"></div></section>
<div class="section-title"><h2>担当カード一覧</h2><div class="muted">表示件数：<span class="count" id="count">0</span> 件</div></div>
<div class="tablewrap"><table><thead><tr><th>日程</th><th>リーグ</th><th>対戦カード</th><th>会場</th><th>担当区分</th></tr></thead><tbody id="results"><tr><td colspan="5" class="empty">審判員を選択してください。</td></tr></tbody></table></div>
<footer class="foot">データは添付されたスプレッドシートを基にしています。担当試合数の集計値と、リーグ別シートから抽出した担当カードは、元ファイルの更新状況により一致しない場合があります。公開前に、データの正確性・公開可否を確認してください。</footer>
</main>
<script>
let data;
const $=id=>document.getElementById(id);
async function init(){try{const res=await fetch('./data.json');if(!res.ok)throw new Error('data');data=await res.json();const sel=$('referee');sel.innerHTML='<option value="">審判員を選択してください</option>';data.referees.sort((a,b)=>a.number.localeCompare(b.number,undefined,{numeric:true})).forEach((r,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=`${r.number} ${r.name}`;sel.appendChild(o)});sel.addEventListener('change',render);['keyword','league','role'].forEach(id=>$(id).addEventListener(id==='keyword'?'input':'change',render));}catch(e){$('results').innerHTML='<tr><td colspan="5" class="empty">データを読み込めませんでした。index.html と data.json を同じフォルダに配置してください。</td></tr>';}}
function render(){const idx=$('referee').value;if(idx===''){$('summary').hidden=true;$('count').textContent='0';$('results').innerHTML='<tr><td colspan="5" class="empty">審判員を選択してください。</td></tr>';return}
const r=data.referees[Number(idx)];$('summary').hidden=false;$('number').textContent=r.number;$('name').textContent=r.name;$('affiliation').textContent=r.affiliation||'所属情報なし';
$('stats').innerHTML='';[['B.PREMIER',r.totals['B.PREMIER']],['B.ONE',r.totals['B.ONE']],['B.NEXT',r.totals['B.NEXT']],['合計',r.totals['合計']]].forEach(([label,val],i)=>{const d=document.createElement('div');d.className='stat'+(i===3?' total':'');d.innerHTML=`<small>${label}</small><strong>${Number(val)||0}<span style="font-size:13px;margin-left:4px">試合</span></strong>`;$('stats').appendChild(d)});
const key=$('keyword').value.trim().toLowerCase(),league=$('league').value,role=$('role').value;
const rows=data.games.filter(g=>g.referee===r.name&&(!league||g.league===league)&&(!role||g.role===role)&&(!key||`${g.card} ${g.venue} ${g.date}`.toLowerCase().includes(key))).sort((a,b)=>a.date.localeCompare(b.date)||a.card.localeCompare(b.card,'ja'));
$('count').textContent=rows.length;if(!rows.length){$('results').innerHTML='<tr><td colspan="5" class="empty">条件に一致する担当カードはありません。</td></tr>';return}
$('results').innerHTML=rows.map(g=>`<tr><td>${esc(g.date)}</td><td>${esc(g.league)}</td><td><strong>${esc(g.card)}</strong></td><td>${esc(g.venue||'—')}</td><td><span class="pill">${esc(g.role)}</span></td></tr>`).join('');
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
